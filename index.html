<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="ROAD TO FRONTIER - an Amiga-style strategy game about growing a Microsoft partner from Network member to Frontier Partner." />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Frontier" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>ROAD TO FRONTIER</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 23 23'%3E%3Crect width='10' height='10' fill='%23f25022'/%3E%3Crect x='12' width='10' height='10' fill='%237fba00'/%3E%3Crect y='12' width='10' height='10' fill='%2300a4ef'/%3E%3Crect x='12' y='12' width='10' height='10' fill='%23ffb900'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="shell">
      <div id="stage">
        <canvas id="screen" width="320" height="256" aria-label="ROAD TO FRONTIER game screen" tabindex="0"></canvas>
        <div id="crt" aria-hidden="true"></div>
      </div>
      <div id="dpad" class="pad" aria-hidden="true">
        <div class="dpad-btn" data-key="up"></div>
        <div class="dpad-btn" data-key="left"></div>
        <div class="dpad-hub"></div>
        <div class="dpad-btn" data-key="right"></div>
        <div class="dpad-btn" data-key="down"></div>
      </div>
      <div id="fire" class="pad" aria-hidden="true">
        <div class="fire-btn" data-key="enter"></div>
      </div>
    </div>
    <noscript>ROAD TO FRONTIER needs JavaScript enabled.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
